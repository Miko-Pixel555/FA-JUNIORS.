<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FA Juniors — ابتكار اليوم، غذاء الغد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS
   Palette pulls two things directly from FA Juniors' own materials:
   the deep-forest/leaf greens of their wordmark, and the warm
   harvest gold + clay accents echoed from the "World Food Day"
   moodboard. Diagonal wedge cuts are lifted from their own pitch
   deck (bottom-corner color blocks) so the site reads as a
   continuation of the brand, not a generic template.
   Typeface: Cairo only — one family, weight-driven hierarchy, so
   the Arabic/English toggle never causes a visual identity shift.
   ============================================================ */
:root{
  --forest-900:#08210f;
  --forest-700:#0f4023;
  --leaf-600:#1f7a41;
  --sprout-400:#7ecb8f;
  --gold-500:#e2a63b;
  --clay-500:#c85a2b;
  --cream-100:#f7f4e7;

  --bg:var(--cream-100);
  --bg-alt:#eef0e2;
  --surface:#ffffff;
  --text:#122317;
  --text-muted:#4b5c50;
  --border:#dcdfcd;
  --header-bg:rgba(247,244,231,0.9);
  --shadow:0 10px 30px -12px rgba(8,33,15,0.18);
  --radius-md:14px;
  --radius-lg:22px;
  --transition:200ms ease;
  --accent-grad:linear-gradient(135deg,var(--leaf-600),var(--forest-700));
}
[data-theme="dark"]{
  --bg:#081a0f;
  --bg-alt:#0d2416;
  --surface:#0f2a19;
  --text:#eef3ec;
  --text-muted:#9db5a4;
  --border:#1c3d27;
  --header-bg:rgba(8,26,15,0.85);
  --shadow:0 10px 30px -12px rgba(0,0,0,0.5);
  --cream-100:#0f2a19;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Cairo',Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background var(--transition),color var(--transition);
  min-height:100vh;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{margin:0 0 .5em;font-weight:800;line-height:1.25;}
p{line-height:1.8;margin:0 0 1em;color:var(--text-muted);}
.container{max-width:1180px;margin-inline:auto;padding-inline:20px;}
.hidden{display:none !important;}
::selection{background:var(--sprout-400);color:var(--forest-900);}

/* ---------- Header ---------- */
header.site-header{
  position:sticky;top:0;z-index:50;
  background:var(--header-bg);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;padding-block:12px;gap:14px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;}
.brand-mark{position:relative;height:38px;width:auto;flex:none;display:inline-flex;}
.brand-mark img{height:100%;width:auto;display:block;object-fit:contain;}
nav.main-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
nav.main-links a{
  padding:8px 14px;border-radius:999px;font-weight:600;font-size:.92rem;
  color:var(--text-muted);transition:var(--transition);white-space:nowrap;
}
nav.main-links a:hover{background:var(--bg-alt);color:var(--text);}
nav.main-links a.active{background:var(--leaf-600);color:#fff;}
.header-tools{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:1rem;transition:var(--transition);
}
.icon-btn:hover{border-color:var(--leaf-600);transform:translateY(-1px);}
.lang-btn{width:auto;padding:0 12px;font-weight:700;font-size:.8rem;letter-spacing:.03em;}
.hamburger{display:none;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;
  border:none;font-weight:700;font-size:.94rem;transition:var(--transition);
}
.btn-primary{background:var(--accent-grad);color:#fff;box-shadow:0 8px 20px -8px rgba(31,122,65,.55);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 24px -8px rgba(31,122,65,.6);}
.btn-outline{background:transparent;border:2px solid var(--leaf-600);color:var(--leaf-600);}
.btn-outline:hover{background:var(--leaf-600);color:#fff;}
.btn-ghost{background:var(--bg-alt);color:var(--text);}
.btn-ghost:hover{background:var(--border);}
.btn-danger{background:#b9412a;color:#fff;}
.btn-sm{padding:7px 14px;font-size:.82rem;border-radius:999px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Diagonal wedge motif (reused brand device) ---------- */
.wedge-corner{position:relative;overflow:hidden;}
.wedge-corner::after{
  content:'';position:absolute;inset-inline-end:-6%;bottom:-18%;width:46%;height:70%;
  background:var(--sprout-400);opacity:.25;
  clip-path:polygon(30% 0,100% 0,100% 100%,0 100%);
  pointer-events:none;
}
.leaf-fold{position:absolute;top:0;inset-inline-end:0;width:26px;height:26px;
  background:var(--gold-500);clip-path:polygon(0 0,100% 0,100% 100%);}

/* ---------- Hero ---------- */
.hero{
  background:var(--accent-grad);color:#fff;padding-block:64px 80px;position:relative;overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% 92%,0 100%);
}
.hero::before{
  content:'';position:absolute;inset-inline-end:-10%;top:-20%;width:60%;height:140%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 60%);
}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;position:relative;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);
  padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.04em;margin-bottom:16px;
}
.hero h1{font-size:clamp(2rem,4.2vw,3.1rem);color:#fff;margin-bottom:14px;}
.hero .tagline{font-size:1.15rem;font-weight:600;color:var(--gold-500);margin-bottom:16px;}
.hero p.lead{color:rgba(255,255,255,.86);font-size:1.05rem;max-width:52ch;}
.hero-actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;}
.hero-badge-logo{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-lg);
  padding:34px;display:flex;align-items:center;justify-content:center;
}
.hero-badge-logo img{width:100%;max-width:230px;height:auto;}

/* ---------- Stats ---------- */
.stats-section{padding-block:56px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-bottom:40px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:24px 22px;box-shadow:var(--shadow);
}
.stat-card .num{font-size:2.4rem;font-weight:900;color:var(--leaf-600);display:block;}
.stat-card .lbl{font-size:.86rem;font-weight:700;color:var(--text-muted);}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.chart-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:22px;box-shadow:var(--shadow);
}
.chart-card h3{font-size:1rem;}
.chart-card .chart-wrap{position:relative;height:230px;}

/* ---------- Section titles ---------- */
.section-title{text-align:center;margin-bottom:34px;}
.section-title h2{font-size:clamp(1.6rem,3vw,2.2rem);}
.section-title p{max-width:60ch;margin-inline:auto;}

/* ---------- Gallery ---------- */
.gallery-toolbar{
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:16px 18px;margin-bottom:28px;box-shadow:var(--shadow);
}
.search-box{position:relative;flex:1;min-width:220px;}
.search-box input{
  width:100%;padding:11px 16px;padding-inline-start:38px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-family:inherit;font-size:.92rem;
}
.search-box::before{content:'🔍';position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);font-size:.85rem;}
select.year-filter{
  padding:11px 16px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-family:inherit;font-weight:600;font-size:.88rem;
}
.result-count{font-size:.82rem;color:var(--text-muted);font-weight:600;white-space:nowrap;}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;}
.p-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  overflow:hidden;box-shadow:var(--shadow);transition:transform var(--transition),box-shadow var(--transition);
  display:flex;flex-direction:column;position:relative;
  animation:cardIn .5s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.p-card:hover{transform:translateY(-6px);box-shadow:0 18px 34px -14px rgba(8,33,15,0.3);}
.poster-frame{position:relative;aspect-ratio:4/5;background:var(--bg-alt);overflow:hidden;}
.poster-frame img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
.p-card:hover .poster-frame img{transform:scale(1.06);}
.poster-frame .leaf-fold{width:22px;height:22px;}
.poster-frame.img-broken img{display:none;}
.poster-frame.img-broken::before{
  content:'🌱';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;background:var(--bg-alt);
}
.p-body{padding:16px;display:flex;gap:12px;align-items:center;}
.avatar{
  width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:.95rem;background:var(--leaf-600);overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.p-info{min-width:0;}
.p-info .p-name{font-weight:800;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-info .p-entity{font-size:.82rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.year-chip{
  position:absolute;top:10px;inset-inline-start:10px;background:rgba(8,33,15,.75);color:#fff;
  font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px);
}
.card-link{position:absolute;inset:0;z-index:2;}
.empty-state{
  text-align:center;padding:60px 20px;background:var(--surface);border:1px dashed var(--border);
  border-radius:var(--radius-md);
}
.empty-state .em{font-size:2.4rem;margin-bottom:10px;}

/* ---------- Details page ---------- */
.details-wrap{padding-block:40px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--leaf-600);margin-bottom:22px;}
.details-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:34px;align-items:start;}
.details-poster{border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);background:var(--bg-alt);aspect-ratio:4/5;position:relative;}
.details-poster img{width:100%;height:100%;object-fit:cover;}
.details-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px;box-shadow:var(--shadow);}
.details-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.avatar-lg{width:64px;height:64px;font-size:1.3rem;}
.meta-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:.92rem;}
.meta-row:last-of-type{border-bottom:none;}
.meta-row .k{color:var(--text-muted);font-weight:700;}
.meta-row .v{font-weight:600;text-align:end;}
.bio-block{margin-top:18px;}
.bio-block h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}

/* ---------- About page ---------- */
.about-hero{padding-block:50px;text-align:center;}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:40px;}
.about-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:26px;box-shadow:var(--shadow);}
.about-card h3{color:var(--leaf-600);}
.archive-note{
  background:var(--forest-700);color:#fff;border-radius:var(--radius-lg);padding:30px;text-align:center;
  margin-block:44px;
}
.archive-note h3{color:var(--gold-500);}
.archive-note p{color:rgba(255,255,255,.88);max-width:60ch;margin-inline:auto;}
.org-chart{display:grid;place-items:center;gap:14px;margin-block:20px;}
.org-node{background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;padding:10px 22px;font-weight:700;font-size:.88rem;}
.org-level{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.supporters-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-block:20px;}
.supporter-badge{
  display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-md);padding:20px 28px;min-width:160px;box-shadow:var(--shadow);
}
.supporter-badge .mark{width:56px;height:56px;border-radius:50%;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;}
.contact-box{text-align:center;padding-block:20px;}

/* ---------- Forms / Login / Admin ---------- */
.auth-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding-block:50px;}
.auth-card{
  width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:36px;box-shadow:var(--shadow);
}
.auth-card .brand-mark{height:56px;width:auto;margin-inline:auto;}
.field{margin-bottom:16px;}
.required-star{color:#c0392b;font-weight:800;}
.field label{display:block;font-size:.84rem;font-weight:700;margin-bottom:6px;color:var(--text-muted);}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-family:inherit;font-size:.92rem;
}
.field textarea{min-height:90px;resize:vertical;}
.form-error{color:#c0392b;font-size:.85rem;font-weight:700;margin-bottom:10px;}
.hint{font-size:.78rem;color:var(--text-muted);margin-top:10px;text-align:center;}

.admin-shell{padding-block:36px;display:grid;grid-template-columns:220px 1fr;gap:24px;}
.admin-sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow);height:fit-content;}
.admin-sidebar button{
  display:flex;width:100%;text-align:start;padding:11px 14px;border-radius:10px;border:none;background:transparent;
  color:var(--text-muted);font-weight:700;font-size:.9rem;margin-bottom:4px;transition:var(--transition);
}
.admin-sidebar button.active{background:var(--leaf-600);color:#fff;}
.admin-sidebar button:hover:not(.active){background:var(--bg-alt);}
.admin-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:26px;box-shadow:var(--shadow);min-height:400px;}
.admin-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
table.admin-table{width:100%;border-collapse:collapse;font-size:.88rem;}
table.admin-table th,table.admin-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:start;}
table.admin-table th{color:var(--text-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;}
table.admin-table tr:hover td{background:var(--bg-alt);}
.row-actions{display:flex;gap:6px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .span2{grid-column:1/-1;}
.import-drop{
  border:2px dashed var(--border);border-radius:var(--radius-md);padding:34px;text-align:center;
  background:var(--bg-alt);
}
.import-drop input[type=file]{margin-top:14px;}
/* ---------- Hidden admin gate ---------- */
.admin-gate-handle{
  position:fixed;top:50%;right:0;transform:translateY(-50%);
  width:14px;height:56px;background:var(--bg-alt);border:1px solid var(--border);border-inline-end:none;
  border-radius:10px 0 0 10px;display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:.8rem;opacity:.3;z-index:120;cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;
  transition:opacity var(--transition);
}
.admin-gate-handle:hover{opacity:.65;}
.admin-gate-overlay{
  position:fixed;inset:0;z-index:300;background:rgba(8,33,15,.6);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.admin-gate-card{
  position:relative;width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:34px 30px;box-shadow:var(--shadow);
}
.admin-gate-close{position:absolute;top:10px;inset-inline-end:10px;}

/* ---------- Footer ---------- */
footer{background:var(--forest-900);color:rgba(255,255,255,.75);padding-block:44px 26px;margin-top:60px;position:relative;}
.footer-grid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start;}
.footer-brand{color:#fff;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.footer-tagline{color:var(--gold-500);font-weight:700;font-size:.92rem;}
footer .footer-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:28px;padding-top:18px;font-size:.8rem;text-align:center;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;inset-inline:0;display:flex;justify-content:center;z-index:200;pointer-events:none;
}
#toast .msg{
  background:var(--forest-900);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;font-size:.88rem;
  box-shadow:var(--shadow);transform:translateY(20px);opacity:0;transition:all .3s ease;
}
#toast .msg.show{transform:translateY(0);opacity:1;}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr;}
  .hero-badge-logo{max-width:220px;margin-inline:auto;}
  .charts-grid{grid-template-columns:1fr;}
  .about-grid{grid-template-columns:1fr;}
  .details-grid{grid-template-columns:1fr;}
  .admin-shell{grid-template-columns:1fr;}
  .admin-sidebar{display:flex;overflow-x:auto;gap:4px;}
  .admin-sidebar button{white-space:nowrap;width:auto;}
  .form-grid{grid-template-columns:1fr;}
}
@media (max-width:640px){
  nav.main-links{display:none;position:absolute;top:100%;inset-inline:0;background:var(--surface);
    flex-direction:column;align-items:stretch;padding:12px;border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
  nav.main-links.open{display:flex;}
  nav.main-links a{text-align:center;}
  .hamburger{display:flex;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a href="#home" class="brand" data-i18n-brand>
      <span class="brand-mark"><img id="headerLogoImg" src="" alt="FA Juniors"></span>
      <span>FA Juniors</span>
    </a>
    <nav class="main-links" id="mainNav">
      <a href="#home" data-route="home" data-t="nav_home">Home</a>
      <a href="#about" data-route="about" data-t="nav_about">About</a>
    </nav>
    <div class="header-tools">
      <button class="icon-btn hamburger" id="hamburgerBtn" aria-label="menu">☰</button>
      <button class="icon-btn" id="themeToggle" title="Theme">🌙</button>
      <button class="icon-btn lang-btn" id="langToggle" title="Language">EN</button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="container footer-grid">
    <div>
      <div class="footer-brand"><span class="brand-mark" style="height:26px;"><img src="" id="footerLogoImg" alt="FA Juniors"></span> FA Juniors</div>
      <div class="footer-tagline" data-t="tagli
